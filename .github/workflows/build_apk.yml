name: Build APK and Windows ZIP

on:
  workflow_dispatch:

jobs:

  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Create Android Platform If Missing
        run: flutter create .

      - name: Get Packages
        run: flutter pub get

      - name: Build Universal APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Create Windows Platform If Missing
        run: flutter create .

      - name: Get Packages
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Create Windows ZIP
        run: |
          powershell Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath build/windows/x64/runner/windows-release.zip

      - name: Upload Windows ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/windows/x64/runner/windows-release.zip
